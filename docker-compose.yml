version: "3.9"

services:
  db:
    image: postgres:15
    container_name: paisa-vasool-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: paisa-vasool
      POSTGRES_DB: paisa-vasool-db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: paisa-vasool-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  auth-service:
    build:
      context: ./paisa-vasool-backend
    container_name: paisa-vasool-auth
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_USER: postgres
      DB_PASSWORD: paisa-vasool
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: paisa-vasool-db
    ports:
      - "8001:8001"
  payment-service:
    build:
      context: ./payment_intake_matching_service
    container_name: paisa-vasool-payment
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_USER: postgres
      DB_PASSWORD: paisa-vasool
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: paisa-vasool-db
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8002:8002"

  rq-worker:
    build:
      context: ./payment_intake_matching_service
    container_name: paisa-vasool-rq-worker
    restart: always
    command: rq worker --url redis://redis:6379 default
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_USER: postgres
      DB_PASSWORD: paisa-vasool
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: paisa-vasool-db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GROQ_API_KEY: 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
      GOOGLE_API_KEY: AIzaSyBlVP0MtHvwjkAmID5N8F12gggAurX7pek
      JWT_SECRET_KEY: secret_key
      JWT_REFRESH_SECRET_KEY: refresh_secret_key
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_MINUTES: 60
      JWT_REFRESH_SECRET_KEY_EXPIRATION_DAYS: 7
      BASE_URL: http://payment-service:8002
    volumes:
      - uploads_data:/app/uploads
  main-service:
    build:
      context: ./main-service
    container_name: paisa-vasool-main
    restart: always
    depends_on:
      - auth-service
      - payment-service
    environment:
      DB_USER: postgres
      DB_PASSWORD: paisa-vasool
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: paisa-vasool-db
      AUTH_SERVICE_URL: http://auth-service:8001
      MATCHING_SERVICE_URL: http://payment-service:8002
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./paisa-vasool-frontend
    container_name: paisa-vasool-frontend
    restart: always
    depends_on:
      - auth-service
      - payment-service
      - main-service
    ports:
      - "80:80"

volumes:
  postgres_data:
  redis_data:
  uploads_data: